<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشاريع وبرامج مؤسسة تنمية الشبابية الاجتماعية</title>
  <meta
    name="description"
    content="مشاريع وبرامج مؤسسة تنمية الشبابية الاجتماعية، ومكتبتها الرقمية لمواد كل مشروع، مع روابط تنزيل مباشرة لملفاتها المستضافة على Internet Archive."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand-logo">
        <img
          src="assets/images/institution-logo.png"
          alt="شعار مؤسسة تنمية الشبابية الاجتماعية"
          class="institution-logo"
          onerror="this.hidden=true; var f=document.getElementById('logoFallbackHome'); if (f) { f.style.display='flex'; }"
        />
        <span id="logoFallbackHome" class="logo-fallback" role="img" aria-label="مساحة محجوزة لشعار المؤسسة، لم يُرفع ملف الشعار بعد">شعار المؤسسة</span>
      </div>
      <div class="site-header-text">
        <p class="site-title">
          <a href="index.html">مشاريع وبرامج مؤسسة تنمية الشبابية الاجتماعية</a>
        </p>
        <p class="institution-name">مؤسسة تنمية الشبابية الاجتماعية</p>
        <p class="site-tagline">المكتبة الرقمية لمواد مشاريع المؤسسة وبرامجها</p>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>مشاريع وبرامج مؤسسة تنمية الشبابية الاجتماعية</h1>
    </div>
  </section>

  <section>
    <div class="container">
      <h2 class="section-heading">المشاريع والبرامج</h2>
      <div id="featured-projects"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copyright">
        © <span class="current-year"></span> مؤسسة تنمية الشبابية الاجتماعية. جميع الحقوق محفوظة.
      </p>
    </div>
  </footer>

  <script>
    (function () {
      // منع تخزين المتصفح أو شبكة توزيع GitHub Pages نسخة قديمة
      // من بيانات المواد أو منطق العرض: كل تحميل صفحة يجلب النسخة
      // الحالية فعليًا عبر طابع زمني فريد في رابط كل ملف، بدل نسخة
      // قد تكون محفوظة مؤقتًا من زيارة سابقة وتُظهر عددًا أقل من المواد.
      var v = Date.now();
      var dataScript = document.createElement("script");
      dataScript.src = "data/materials.js?v=" + v;
      dataScript.onload = function () {
        var appScript = document.createElement("script");
        appScript.src = "assets/js/app.js?v=" + v;
        document.body.appendChild(appScript);
      };
      document.body.appendChild(dataScript);
    })();
  </script>
</body>
</html>
