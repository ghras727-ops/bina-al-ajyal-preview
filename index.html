<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشاريع وبرامج مؤسسة تنمية الشبابية الاجتماعية</title>
  <meta
    name="description"
    content="مشاريع وبرامج مؤسسة تنمية الشبابية الاجتماعية، ومكتبتها الرقمية لمواد كل مشروع، مع روابط تنزيل مباشرة لملفاتها المستضافة على Internet Archive."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/css/style.css?v=1" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand-logo">
        <img
          src="assets/images/institution-logo.png"
          alt="شعار المؤسسة"
          class="institution-logo"
          onerror="this.hidden=true; var f=document.getElementById('logoFallbackHome'); if (f) { f.style.display='flex'; }"
        />
        <span id="logoFallbackHome" class="logo-fallback" role="img" aria-label="مساحة محجوزة لشعار المؤسسة، لم يُرفع ملف الشعار بعد">شعار المؤسسة</span>
      </div>
      <div class="site-header-text">
        <p class="site-title">
          <a href="index.html">مشاريع وبرامج مؤسسة تنمية الشبابية الاجتماعية</a>
        </p>
        <p class="institution-name">مؤسسة تنمية الشبابية الاجتماعية</p>
        <p class="site-tagline">المكتبة الرقمية لمواد مشاريع المؤسسة وبرامجها</p>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>مشاريع وبرامج مؤسسة تنمية الشبابية الاجتماعية</h1>
    </div>
  </section>

  <section class="site-search-section">
    <div class="container">
      <div class="site-search" id="site-search">
        <label for="site-search-input" class="visually-hidden">البحث في الموقع</label>
        <input
          type="text"
          id="site-search-input"
          class="site-search-input"
          placeholder="ابحث في المشاريع والأقسام والمواد..."
          autocomplete="off"
          spellcheck="false"
          role="combobox"
          aria-expanded="false"
          aria-haspopup="listbox"
          aria-controls="site-search-results"
          aria-autocomplete="list"
        />
        <div
          class="site-search-results"
          id="site-search-results"
          role="listbox"
          aria-label="نتائج البحث"
          hidden
        ></div>
      </div>
    </div>
  </section>

  <section class="library-stats-section">
    <div class="container">
      <div class="stats-card" id="library-stats" aria-live="polite"></div>
    </div>
  </section>

  <section class="recent-updates-section">
    <div class="container">
      <div id="recent-updates"></div>
    </div>
  </section>

  <section>
    <div class="container">
      <h2 class="section-heading">المشاريع والبرامج</h2>
      <div id="featured-projects"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <p class="footer-copyright">
        © <span class="current-year"></span> مؤسسة تنمية الشبابية الاجتماعية. جميع الحقوق محفوظة.
      </p>
    </div>
  </footer>

  <script src="data/materials.js?v=1"></script>
  <script src="assets/js/app.js?v=1"></script>
  <script src="assets/js/site-refresh.js?v=1"></script>
</body>
</html>
